name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  debug:
    name: Debug + Sanitizers + Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++

      - name: Configure
        run: cmake --preset clang-debug

      - name: Build
        run: cmake --build --preset clang-debug

      - name: Test
        run: ctest --preset clang-debug --output-on-failure
